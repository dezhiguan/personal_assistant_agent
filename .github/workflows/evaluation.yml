name: LangSmith evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluations/**'
      - 'src/personal_assistant_agent/prompts/**'
      - 'src/personal_assistant_agent/agents/**'
      - 'src/personal_assistant_agent/evaluation/**'
      - 'src/personal_assistant_agent/observability/**'
      - 'src/personal_assistant_agent/services/**'
      - 'scripts/evaluate_agent.py'
      - '.github/workflows/evaluation.yml'
permissions:
  contents: read
concurrency:
  group: assistant-live-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      MODEL_NAME: qwen-plus
      LANGSMITH_TRACING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check evaluation credentials
        id: credentials
        run: |
          python - <<'PY'
          import os
          missing = [key for key in ('DASHSCOPE_API_KEY', 'LANGSMITH_API_KEY') if not os.environ.get(key)]
          ready = not missing
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ready={str(ready).lower()}\n")
          if missing:
              message = 'Live evaluation requires repository secrets: ' + ', '.join(missing)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Live evaluation skipped\n' + message + '\n')
              if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  raise SystemExit(message)
              print('::warning::' + message)
          PY
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.3
        if: steps.credentials.outputs.ready == 'true'
      - run: uv sync --locked
        if: steps.credentials.outputs.ready == 'true'
      - run: uv run python scripts/sync_pricing.py
        if: steps.credentials.outputs.ready == 'true'
      - run: uv run python scripts/sync_prompt.py
        if: steps.credentials.outputs.ready == 'true'
      - run: uv run python scripts/evaluate_agent.py --judge
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.credentials.outputs.ready == 'true'
        with:
          name: langsmith-evaluation-report
          path: artifacts/evaluations/
